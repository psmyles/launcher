[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Project automation: `cargo xtask check | ttfp | idle | e2e | docs | icons | package-*`.

[dependencies]
serde_json = "1"
# `icons`: decodes the logo and scales it (the version arboard already pulls in).
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",          # child creation and CPU times
    "Win32_UI_Accessibility",          # SetWinEventHook (out-of-process "window shown")
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
